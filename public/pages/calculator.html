<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
    <script src="../../src/scripts/calculator.js"></script>
    <link rel="stylesheet" href="../../src/styles/calculator.css">
</head>
<body>
   <div class="container1">
    <div>
        <input type="text" id="txtValue" readonly>
    </div>
    <div class="btn-container">
        <button onclick="clearClick()">AC</button>
        <button onclick="deleteClick()">DL</button>
        <button onclick="addItem('.')">.</button>
        <button class="orange" onclick="addItem('/')">/</button>
    </div>
    <div class="btn-container">
        <button onclick="addItem('7')">7</button>
        <button onclick="addItem('8')">8</button>
        <button onclick="addItem('9')">9</button>
        <button class="orange" onclick="addItem('*')">*</button>
    </div>
    <div class="btn-container">
        <button onclick="addItem('4')">4</button>
        <button onclick="addItem('5')">5</button>
        <button onclick="addItem('6')">6</button>
        <button class="orange" onclick="addItem('-')">-</button>
    </div>
    <div class="btn-container">
        <button onclick="addItem('1')">1</button>
        <button onclick="addItem('2')">2</button>
        <button onclick="addItem('3')">3</button>
        <button class="orange" onclick="addItem('+')">+</button>
    </div>
    <div class="btn-container">
        <button onclick="addItem('00')">00</button>
        <button onclick="addItem('0')">0</button>
        <button class="equal" onclick="calculateClick()">=</button>
    </div>
   </div>
</body>
</html>
